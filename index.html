<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProSmart - Smart Living, Simplified</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b111e; color: #f1f5f9; min-height: 100vh; padding-bottom: 60px; }

    /* Top Navigation */
    header { background-color: #0e1626; border-bottom: 1px solid #1e293b; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 30; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #fff; }
    .brand-sub { font-size: 11px; color: #38bdf8; font-weight: 600; letter-spacing: 0.5px; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    
    .status-badge { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }
    
    .btn-sync { background: #06b6d4; color: #04121f; border: none; font-weight: 700; font-size: 12px; padding: 8px 16px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-sync:hover { background: #22d3ee; }
    
    .btn-cred { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; font-weight: 600; font-size: 12px; padding: 8px 14px; border-radius: 10px; cursor: pointer; }
    .btn-cred:hover { background: #334155; }

    /* Subheader & Filters */
    .filter-bar { max-width: 1300px; margin: 20px auto 0; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .counter-text { font-size: 14px; color: #94a3b8; font-weight: 500; }
    .counter-highlight { color: #fff; font-weight: 700; }
    .search-input { background: #121a2d; border: 1px solid #1e293b; border-radius: 10px; padding: 8px 14px; color: #fff; font-size: 13px; width: 240px; outline: none; }
    .search-input:focus { border-color: #06b6d4; }

    /* Devices Grid */
    main { max-width: 1300px; margin: 20px auto; padding: 0 24px; }
    .devices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 18px; }
    
    /* Device Card */
    .device-card { background: #121a2d; border: 1px solid #1e293b; border-radius: 16px; padding: 20px; transition: transform 0.15s, border-color 0.15s; position: relative; }
    .device-card:hover { border-color: rgba(6, 182, 212, 0.4); transform: translateY(-2px); }
    .device-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .device-icon-box { width: 44px; height: 44px; border-radius: 12px; background: rgba(6, 182, 212, 0.12); border: 1px solid rgba(6, 182, 212, 0.25); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .device-meta { flex: 1; margin-left: 12px; }
    .device-name { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .device-cat { font-size: 11px; color: #94a3b8; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Toggle Switch */
    .switch-wrap { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06); }
    .status-text { font-size: 12px; color: #94a3b8; }
    .online-indicator { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399; margin-right: 4px; }
    .offline-indicator { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ef4444; margin-right: 4px; }
    
    .toggle-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-weight: 700; font-size: 12px; padding: 7px 16px; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
    .toggle-btn.on { background: #06b6d4; border-color: #22d3ee; color: #020617; box-shadow: 0 0 14px rgba(6,182,212,0.4); }
    .toggle-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Empty State */
    .empty-state { text-align: center; padding: 60px 20px; background: #0e1626; border: 1px dashed #334155; border-radius: 20px; max-width: 600px; margin: 40px auto; }
    .empty-icon { font-size: 42px; margin-bottom: 12px; }
    .empty-title { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .empty-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }

    /* Toast Notification */
    #toast { position: fixed; top: 24px; right: 24px; background: #0e1626; border: 1px solid #06b6d4; border-radius: 12px; padding: 14px 20px; color: #fff; font-size: 13px; z-index: 1000; box-shadow: 0 15px 35px rgba(0,0,0,0.6); opacity: 0; transform: translateY(-40px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* Modal Backdrop */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-box { background: #0e1626; border: 1px solid rgba(6, 182, 212, 0.4); border-radius: 20px; width: 100%; max-width: 580px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); overflow: hidden; }
    .modal-head { background: #121c30; border-bottom: 1px solid #1e293b; padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; }
    .modal-head-title { font-size: 16px; font-weight: 700; color: #fff; }
    .close-x-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: 16px; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .close-x-btn:hover { background: #ef4444; color: #fff; border-color: #ef4444; }
    .modal-body { padding: 24px; font-size: 13px; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    .form-input { width: 100%; background: #141e33; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; color: #fff; font-size: 13px; outline: none; }
    .form-input:focus { border-color: #06b6d4; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-footer { display: flex; gap: 12px; margin-top: 20px; }
    .btn-full { width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; border: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Toast Notification -->
  <div id="toast">
    <strong id="toastTitle">Notification</strong>
    <p id="toastDesc" style="font-size: 11px; color: #94a3b8; margin-top: 3px;">Status update</p>
  </div>

  <!-- Header Navigation -->
  <header>
    <div class="brand">
      <div>
        <div class="brand-title">PROSMART</div>
        <div class="brand-sub">SMART LIVING, SIMPLIFIED</div>
      </div>
    </div>
    <div class="header-actions">
      <div class="status-badge">
        <div class="status-dot"></div>
        <span id="headerStatus">Tuya Cloud Ready</span>
      </div>
      <button class="btn-sync" onclick="syncAllDevices()">
        <span>🚀 Sync All Devices</span>
      </button>
      <button class="btn-cred" onclick="openModal()">🔑 API Keys</button>
    </div>
  </header>

  <!-- Filter & Count Bar -->
  <div class="filter-bar">
    <div class="counter-text">
      Total Devices: <span class="counter-highlight" id="deviceCounter">0</span>
    </div>
    <input type="text" class="search-input" id="searchBox" placeholder="Filter devices by name..." oninput="filterDevices(this.value)">
  </div>

  <!-- Main Devices Grid -->
  <main>
    <div id="devicesContainer" class="devices-grid">
      <!-- Generated device cards will automatically populate here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">🔌</div>
      <div class="empty-title">No Devices Loaded Yet</div>
      <div class="empty-desc">
        Click <strong>"Sync All Devices"</strong> above to query your Tuya Cloud project and import all paired lights, switches, plugs, and sensors at once!
      </div>
      <button class="btn-sync" style="margin: 0 auto; padding: 12px 24px; font-size: 14px;" onclick="syncAllDevices()">
        🚀 Sync & Import All 100+ Devices
      </button>
    </div>
  </main>

  <!-- API Credentials Modal -->
  <div class="modal-backdrop hidden" id="credModal">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-head-title">Tuya Cloud OpenAPI Setup</div>
        <button class="close-x-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Data Center Region</label>
            <select id="cfgRegion" class="form-input">
              <option value="eu-central-1">EU Central (Frankfurt) - eu-central-1</option>
              <option value="us-east-1">US East (Virginia) - us-east-1</option>
              <option value="us-west-2">US West (Oregon) - us-west-2</option>
              <option value="cn-north-1">China Data Center</option>
            </select>
          </div>
          <div class="form-group">
            <label>Cloud Project ID</label>
            <input type="text" id="cfgProjectId" class="form-input" placeholder="p174527...">
          </div>
        </div>

        <div class="form-group">
          <label>Access ID / Client ID</label>
          <input type="text" id="cfgClientId" class="form-input" placeholder="7ry5jhn3ynw84aqpfrgd">
        </div>

        <div class="form-group">
          <label>Access Secret / Secret Key</label>
          <input type="password" id="cfgSecret" class="form-input" placeholder="••••••••••••••••••••">
        </div>

        <div class="modal-footer">
          <button class="btn-cred btn-full" onclick="testConnection()">🔍 Test Handshake</button>
          <button class="btn-sync btn-full" onclick="saveCredentials()">💾 Save & Sync</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allDevices = [];

    // Notification toast
    function notify(title, desc) {
      const t = document.getElementById('toast');
      document.getElementById('toastTitle').textContent = title;
      document.getElementById('toastDesc').textContent = desc;
      t.className = 'show';
      setTimeout(() => { t.className = ''; }, 3500);
    }

    function openModal() { document.getElementById('credModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('credModal').classList.add('hidden'); }

    // Load saved settings
    function loadSavedSettings() {
      const cid = localStorage.getItem('prosmart_tuya_clientId');
      if (cid) {
        document.getElementById('cfgClientId').value = cid;
        document.getElementById('cfgSecret').value = localStorage.getItem('prosmart_tuya_secret') || '';
        document.getElementById('cfgProjectId').value = localStorage.getItem('prosmart_tuya_projectId') || '';
        document.getElementById('cfgRegion').value = localStorage.getItem('prosmart_tuya_region') || 'eu-central-1';
      }
      
      const cached = localStorage.getItem('prosmart_cached_devices');
      if (cached) {
        try {
          allDevices = JSON.parse(cached);
          renderDevices(allDevices);
        } catch(e) {}
      }
    }

    function saveCredentials() {
      localStorage.setItem('prosmart_tuya_clientId', document.getElementById('cfgClientId').value.trim());
      localStorage.setItem('prosmart_tuya_secret', document.getElementById('cfgSecret').value.trim());
      localStorage.setItem('prosmart_tuya_projectId', document.getElementById('cfgProjectId').value.trim());
      localStorage.setItem('prosmart_tuya_region', document.getElementById('cfgRegion').value);
      notify('Keys Saved', 'Credentials updated. Starting device discovery...');
      closeModal();
      syncAllDevices();
    }

    // Auto-Discovery: Import all 100+ devices in one request
    async function syncAllDevices() {
      const clientId = localStorage.getItem('prosmart_tuya_clientId') || document.getElementById('cfgClientId').value.trim();
      const clientSecret = localStorage.getItem('prosmart_tuya_secret') || document.getElementById('cfgSecret').value.trim();
      const region = localStorage.getItem('prosmart_tuya_region') || 'eu-central-1';

      if (!clientId || !clientSecret) {
        notify('Credentials Required', 'Please enter your Tuya Client ID and Secret Key.');
        openModal();
        return;
      }

      notify('Importing Devices...', 'Querying Tuya Cloud for all paired devices...');

      try {
        const res = await fetch('/api/tuya', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, clientSecret, region, action: 'get_all_devices' })
        });
        const data = await res.json();

        if (data.success && data.devices && data.devices.length > 0) {
          allDevices = data.devices;
          localStorage.setItem('prosmart_cached_devices', JSON.stringify(allDevices));
          renderDevices(allDevices);
          notify('Import Complete! 🎉', `Successfully loaded ${allDevices.length} devices from Tuya.`);
          document.getElementById('headerStatus').textContent = `${allDevices.length} Devices Online`;
        } else {
          notify('Notice', data.error || 'Connected, but no paired devices returned by Tuya.');
        }
      } catch (err) {
        notify('API Connection Note', 'Ensure api/tuya.js is deployed on Vercel.');
      }
    }

    // Test API Handshake
    async function testConnection() {
      const clientId = document.getElementById('cfgClientId').value.trim();
      const clientSecret = document.getElementById('cfgSecret').value.trim();
      const region = document.getElementById('cfgRegion').value;

      if (!clientId || !clientSecret) {
        notify('Missing Info', 'Enter your Client ID & Secret first.');
        return;
      }

      notify('Testing Handshake...', 'Validating HMAC-SHA256 signature with Tuya...');

      try {
        const res = await fetch('/api/tuya', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId, clientSecret, region, action: 'test' })
        });
        const data = await res.json();
        if (data.success) {
          notify('Handshake Successful! 🎉', 'Tuya verified your credentials.');
        } else {
          notify('Auth Failed', data.error || 'Check your keys in Tuya Developer Console.');
        }
      } catch (e) {
        notify('Vercel Note', 'Make sure api/tuya.js is deployed in your repository.');
      }
    }

    // Choose appropriate icon by category or name
    function getDeviceIcon(category = '', name = '') {
      const n = name.toLowerCase();
      const c = category.toLowerCase();
      if (c.includes('dj') || n.includes('light') || n.includes('bulb') || n.includes('strip') || n.includes('spot')) return '💡';
      if (c.includes('kg') || n.includes('switch') || n.includes('breaker')) return '🔘';
      if (c.includes('cz') || n.includes('socket') || n.includes('plug')) return '🔌';
      if (c.includes('kt') || n.includes('ac') || n.includes('air') || n.includes('climate')) return '❄️';
      if (c.includes('sd') || n.includes('vacuum') || n.includes('sweeper')) return '🤖';
      if (c.includes('cl') || n.includes('curtain') || n.includes('blind')) return '🪟';
      if (c.includes('wk') || n.includes('thermostat') || n.includes('temp')) return '🌡️';
      if (c.includes('sp') || n.includes('camera') || n.includes('cam')) return '📷';
      return '⚡';
    }

    // Render device cards dynamically
    function renderDevices(list) {
      const container = document.getElementById('devicesContainer');
      const emptyState = document.getElementById('emptyState');
      const counter = document.getElementById('deviceCounter');

      counter.textContent = list.length;

      if (!list || list.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      container.innerHTML = list.map((dev) => {
        const isOnline = dev.online !== false;
        // Check power status from status array if available
        let isOn = false;
        if (dev.status && Array.isArray(dev.status)) {
          const powerDp = dev.status.find(s => s.code.startsWith('switch') || s.code === 'power');
          if (powerDp) isOn = Boolean(powerDp.value);
        }

        return `
          <div class="device-card" id="card-${dev.id}">
            <div class="device-head">
              <div class="device-icon-box">${getDeviceIcon(dev.category, dev.name)}</div>
              <div class="device-meta">
                <div class="device-name" title="${dev.name}">${dev.name || 'Tuya Device'}</div>
                <div class="device-cat">${dev.category_name || dev.category || 'General Appliance'}</div>
              </div>
            </div>
            
            <div class="switch-wrap">
              <div class="status-text">
                <span class="${isOnline ? 'online-indicator' : 'offline-indicator'}"></span>
                ${isOnline ? 'Online' : 'Offline'}
              </div>
              <button 
                id="btn-${dev.id}" 
                class="toggle-btn ${isOn ? 'on' : ''}" 
                onclick="toggleDevice('${dev.id}', ${isOn})"
                ${!isOnline ? 'disabled' : ''}
              >
                ${isOn ? 'ON' : 'OFF'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Toggle physical device state
    async function toggleDevice(deviceId, currentStatus) {
      const newStatus = !currentStatus;
      const btn = document.getElementById(`btn-${deviceId}`);
      
      // Optimistic UI update
      if (btn) {
        btn.textContent = newStatus ? 'ON' : 'OFF';
        btn.className = `toggle-btn ${newStatus ? 'on' : ''}`;
        btn.setAttribute('onclick', `toggleDevice('${deviceId}', ${newStatus})`);
      }

      notify('Sending Command', `Switching device to ${newStatus ? 'ON' : 'OFF'}...`);

      const clientId = localStorage.getItem('prosmart_tuya_clientId');
      const clientSecret = localStorage.getItem('prosmart_tuya_secret');
      const region = localStorage.getItem('prosmart_tuya_region') || 'eu-central-1';

      try {
        const res = await fetch('/api/tuya', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            clientId,
            clientSecret,
            region,
            deviceId,
            action: 'command',
            commandCode: 'switch_1',
            value: newStatus
          })
        });
        const result = await res.json();
        if (result.success) {
          notify('Command Executed! ✓', 'Device state updated.');
        } else {
          notify('Device Response', result.msg || 'Command delivered.');
        }
      } catch (err) {
        notify('Command sent', 'Checking local serverless response...');
      }
    }

    // Search filter
    function filterDevices(query) {
      const q = query.toLowerCase();
      const filtered = allDevices.filter(d => 
        (d.name && d.name.toLowerCase().includes(q)) || 
        (d.category && d.category.toLowerCase().includes(q))
      );
      renderDevices(filtered);
    }

    // Initialize on page load
    loadSavedSettings();
  </script>
</body>
</html>
